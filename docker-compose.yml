version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: blacksite-db
    environment:
      POSTGRES_USER: blacksite
      POSTGRES_PASSWORD: blacksite
      POSTGRES_DB: blacksite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blacksite"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
